<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris Colorido</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at top,#2b1055,#7597de 70%,#1a1a2e);font-family:Arial,sans-serif;color:white}
h1{margin:5px 0 2px;font-size:32px}
.wrap{display:flex;gap:14px;align-items:flex-start}
canvas{background:#11112b;border:4px solid #ff00aa;border-radius:14px}
.side{width:150px}
.box{background:#ffffff1a;border:1px solid #ffffff33;border-radius:12px;padding:10px;margin-bottom:10px}
.box b{display:block;margin-bottom:6px}
#next{width:100%;height:80px;background:#00000055;border-radius:8px}
button{width:100%;padding:12px;border:0;border-radius:10px;background:linear-gradient(90deg,#ff00aa,#00e5ff);color:white;font-weight:800;font-size:16px;cursor:pointer}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.controls button{background:#ffffff22;font-size:20px;padding:10px}
.score{font-size:26px;font-weight:900}
</style>
</head>
<body>
<h1>TETRIS COLORIDO</h1>
<p>Use as setas ou os botoes</p>
<div class="wrap">
<canvas id="game" width="300" height="600"></canvas>
<div class="side">
<div class="box">PONTOS<div class="score" id="score">0</div></div>
<div class="box"><b>PROXIMA</b><canvas id="next" width="120" height="80"></canvas></div>
<div class="box"><b>RECORDE</b><div class="score" id="best">0</div></div>
<button onclick="start()">JOGAR DE NOVO</button>
<div class="controls">
<button onclick="move(-1)">◀</button>
<button onclick="rotate()">🔄</button>
<button onclick="move(1)">▶</button>
<button onclick="down()">⬇</button>
<button onclick="hard()">⏬</button>
<button onclick="start()">🔁</button>
</div>
</div>
</div>
<script>
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const nc=document.getElementById('next'),nctx=nc.getContext('2d');
const COLS=10,ROWS=20,S=30;
const COLORS={I:'#00e5ff',J:'#3d5afe',L:'#ff9100',O:'#ffea00',S:'#00e676',T:'#d500f9',Z:'#ff1744'};
const SHAPES={I:[[1,1,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]],O:[[1,1],[1,1]],S:[[0,1,1],[1,1,0]],T:[[0,1,0],[1,1,1]],Z:[[1,1,0],[0,1,1]]};
let board,piece,score=0,best=+localStorage.getItem('tetrisBest')||0,timer;
document.getElementById('best').textContent=best;
function newPiece(){const k=Object.keys(SHAPES)[Math.floor(Math.random()*7)];return {k,m:SHAPES[k].map(r=>[...r]),x:3,y:0}}
let next=newPiece();
function start(){board=Array.from({length:ROWS},()=>Array(COLS).fill(0));score=0;document.getElementById('score').textContent=0;piece=next;next=newPiece();clearInterval(timer);timer=setInterval(()=>{if(!step()){merge();clearLines();piece=next;next=newPiece();if(collide(piece)){clearInterval(timer);alert('Fim de jogo! Pontos: '+score)}}draw()},450);draw()}
function collide(p,dx=0,dy=0,m=p.m){for(let y=0;y<m.length;y++)for(let x=0;x<m[y].length;x++)if(m[y][x]){let nx=p.x+x+dx,ny=p.y+y+dy;if(nx<0||nx>=COLS||ny>=ROWS||(ny>=0&&board[ny][nx]))return true}return false}
function step(){if(!collide(piece,0,1)){piece.y++;return true}return false}
function merge(){piece.m.forEach((r,y)=>r.forEach((v,x)=>{if(v&&piece.y+y>=0)board[piece.y+y][piece.x+x]=piece.k}))}
function clearLines(){let c=0;board=board.filter(r=>{if(r.every(v=>v)){c++;return false}return true});while(board.length<ROWS)board.unshift(Array(COLS).fill(0));if(c){score+=[0,100,300,500,800][c];document.getElementById('score').textContent=score;if(score>best){best=score;localStorage.setItem('tetrisBest',best);document.getElementById('best').textContent=best}}}
function move(d){if(!collide(piece,d,0))piece.x+=d;draw()}
function down(){if(!step()){merge();clearLines();piece=next;next=newPiece()}draw()}
function hard(){while(!collide(piece,0,1))piece.y++;merge();clearLines();piece=next;next=newPiece();draw()}
function rotate(){let m=piece.m[0].map((_,i)=>piece.m.map(r=>r[i]).reverse());if(!collide(piece,0,0,m))piece.m=m;draw()}
function drawCell(c,x,y,s,ct){ct.fillStyle=COLORS[c]||'#333';ct.fillRect(x*s+1,y*s+1,s-2,s-2);ct.fillStyle='rgba(255,255,255,.45)';ct.fillRect(x*s+4,y*s+4,s-8,5)}
function draw(){ctx.fillStyle='#11112b';ctx.fillRect(0,0,300,600);board.forEach((r,y)=>r.forEach((v,x)=>{if(v)drawCell(v,x,y,S,ctx)}));if(piece)piece.m.forEach((r,y)=>r.forEach((v,x)=>{if(v)drawCell(piece.k,piece.x+x,piece.y+y,S,ctx)}));nctx.fillStyle='#000';nctx.fillRect(0,0,120,80);next.m.forEach((r,y)=>r.forEach((v,x)=>{if(v)drawCell(next.k,x+1,y,S-8,nctx)}))}
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='ArrowDown')down();if(e.key==='ArrowUp')rotate();if(e.key===' '){e.preventDefault();hard()}});
start();
</script>
</body>
</html>
